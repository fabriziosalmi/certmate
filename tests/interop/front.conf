# TLS in front of CertMate for the ACME interoperability run (#476).
# RFC 8555 section 6.1 wants the ACME server on HTTPS; CertMate is run behind
# a proxy that ends TLS, with BEHIND_PROXY set, as a production setup is.
events {}
http {
    server {
        listen 443 ssl;
        server_name acme.lab.internal;
        ssl_certificate     /certs/front.pem;
        ssl_certificate_key /certs/front.key;
        location / {
            proxy_pass http://certmate-interop:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
