name: Publish Ansible collection (Galaxy)

# Publishes deploy/ansible as the `fabriziosalmi.certmate` collection (#1031).
# Fires on an `ansible-v*` tag, a version stream of its own like the clients'
# `clients-v*` and the MCP server's `mcp-v*`, so it never collides with the
# server's `v*` releases. Manual runs only build the collection.
on:
  push:
    tags:
      - 'ansible-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: python -m pip install "ansible-core>=2.17,<2.21"

      - name: Fail unless the tag matches galaxy.yml
        # Galaxy versions are write-once: a tag that disagrees with galaxy.yml
        # would publish the wrong number, permanently.
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(python -c "import yaml;print(yaml.safe_load(open('deploy/ansible/galaxy.yml'))['version'])")"
          case "$REF" in
            refs/tags/ansible-v*)
              tag="${REF#refs/tags/ansible-v}"
              if [ "$tag" != "$version" ]; then
                echo "::error::tag says $tag, deploy/ansible/galaxy.yml says $version" >&2
                exit 1
              fi
              ;;
          esac
          echo "fabriziosalmi.certmate $version (ref: $REF)"

      - name: Build
        run: ansible-galaxy collection build deploy/ansible --output-path dist

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/ansible-v')
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy collection publish dist/fabriziosalmi-certmate-*.tar.gz --api-key "$GALAXY_API_KEY"
