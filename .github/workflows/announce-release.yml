name: Announce release

# 1,240 stars and 7 watchers: shipping a release notifies almost nobody. A
# Discussion in Announcements is the one surface people can actually subscribe
# to, and it shows on the repository front page.
#
# MANUAL ON PURPOSE. This does not fire on `release: published`, and that is a
# deliberate difference from publish-chart.yml.
#
# Publishing an artifact is mechanical: it either matches the release or the
# gate stops it. An announcement is the maintainer's voice on a public forum,
# and once posted it has been read. Firing it automatically means a wrong
# release note, a mis-tagged release or a release cut and then withdrawn all
# become communication before anyone has looked at them — and a Discussion
# cannot be un-sent the way a tag can be moved.
#
# So this is a tool, invoked when the release is known to be good. Run it from
# the Actions tab, or:
#
#   gh workflow run announce-release.yml -f tag=v2.25.0
#
# It still refuses to post twice for the same tag, so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g. v2.25.0)'
        required: true
        type: string

# Read-only at the top; the write scope sits on the job that posts. Same
# reason as publish-chart.yml: nothing else in this file should inherit the
# ability to write to Discussions.
permissions:
  contents: read

jobs:
  announce:
    name: post to Announcements
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Post the release to Discussions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # TAG is a workflow_dispatch input. Validate it before it reaches a
          # command line or a query string: a value starting with '-' would be
          # read as a flag by gh, and quotes or a newline would break out of
          # the GraphQL search string below. `case` compares the whole value —
          # grep would match line by line and let a newline through.
          case "$TAG" in
            "" | -*)               echo "::error::tag must be non-empty and must not start with '-': $TAG" >&2; exit 1 ;;
            *[!A-Za-z0-9._-]*)     echo "::error::tag may only contain letters, digits, dot, underscore and hyphen: $TAG" >&2; exit 1 ;;
          esac

          # Read the release rather than trusting the event payload, so a
          # re-run announces exactly what the first run would have.
          name="$(gh release view --repo "$REPO" --json name -q '.name // ""' -- "$TAG")"
          body="$(gh release view --repo "$REPO" --json body -q '.body // ""' -- "$TAG")"
          url="$(gh release view --repo "$REPO" --json url -q .url -- "$TAG")"
          version="${TAG#v}"

          # A release is not required to have a name, and an empty title would
          # create an untitled discussion AND break the de-duplication below.
          # The tag is the one thing always present, so the title is keyed on
          # it: either it already appears in the name, or it is prefixed.
          if [ -z "$name" ]; then
            title="$TAG"
          else
            case "$name" in
              *"$TAG"*) title="$name" ;;
              *) title="$TAG - $name" ;;
            esac
          fi

          # Skip if this release was already announced. Re-running the workflow
          # should be safe: a duplicate announcement is worse than none. Keyed
          # on the tag rather than the full title, which is stable even if the
          # release is later renamed.
          existing="$(gh api graphql -f query='
            query($q: String!) {
              search(query: $q, type: DISCUSSION, first: 5) {
                nodes { ... on Discussion { title url } }
              }
            }' -f q="repo:$REPO in:title \"$TAG\"" -q '.data.search.nodes | length')"
          if [ "$existing" != "0" ]; then
            echo "Already announced ($existing matching discussion(s)); nothing to do."
            exit 0
          fi

          {
            printf '%s\n\n' "$body"
            printf -- '---\n\n'
            printf '## Upgrade\n\n'
            printf '```bash\n'
            printf 'docker pull fabriziosalmi/certmate:%s\n' "$version"
            printf '```\n\n'
            printf 'Helm:\n\n'
            printf '```bash\n'
            printf 'helm upgrade --install certmate oci://ghcr.io/fabriziosalmi/charts/certmate --version %s\n' "$version"
            printf '```\n\n'
            printf 'Full release notes: %s\n\n' "$url"
            printf 'Found a problem with this release? Open an issue — every fix in the last few releases came from someone who did.\n'
          } > body.md

          category_id="$(gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                discussionCategories(first: 20) { nodes { id name } }
              }
            }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" \
            -q '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')"
          [ -n "$category_id" ] || { echo "::error::no Announcements category found" >&2; exit 1; }

          repo_id="$(gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) { id }
            }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -q .data.repository.id)"

          gh api graphql -F repositoryId="$repo_id" -F categoryId="$category_id" \
            -F title="$title" -F body=@body.md -f query='
            mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body}) {
                discussion { url }
              }
            }' -q '.data.createDiscussion.discussion.url' | tee -a "$GITHUB_STEP_SUMMARY"
