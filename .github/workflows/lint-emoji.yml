name: Lint (emoji)

# Mechanises the "zero emoji in public artifacts" rule for the most public one:
# RELEASE_NOTES.md. Arrows and the em-dash are typography, not emoji, and are
# deliberately allowed. Runs on a GitHub-hosted runner so it never competes for
# the single self-hosted host.

on:
  # Also on push (#428): PR-only meant a direct push or an admin merge could
  # land emoji unchecked, and — since release.sh now gates on the required
  # workflows having run for the release commit — that the check was simply
  # absent from every commit on main.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions: read-all

jobs:
  emoji:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Scan the release notes for emoji
      run: |
        python3 - <<'PY'
        import re, sys, pathlib
        # True-emoji ranges. Deliberately EXCLUDES arrows (U+2190-21FF) and the
        # em-dash (U+2014), which the project treats as typography.
        EMOJI = re.compile(
            "[\U0001F000-\U0001FAFF\U00002600-\U000026FF"
            "\U00002700-\U000027BF\U00002B50\U00002B55\U0000FE0F]"
        )
        # RELEASE_NOTES.md is generated from docs/releases/, so the notes
        # themselves are where an emoji would be written and where the error
        # has to point. Scanning only the index would report the right file
        # and the wrong line, in a file nobody edits.
        files = [pathlib.Path("RELEASE_NOTES.md")]
        files += sorted(pathlib.Path("docs/releases").glob("v*.md"))
        if len(files) < 2:
            print("::error::docs/releases/ has no release files; the scan would "
                  "pass by having nothing to read")
            sys.exit(1)
        bad = []
        for p in files:
            for n, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                if EMOJI.search(line):
                    bad.append((p, n, line.strip()))
        if bad:
            for p, n, line in bad:
                print(f"::error file={p},line={n}::emoji not allowed: {line}")
            sys.exit(1)
        print(f"{len(files)} release files: no emoji")
        PY
