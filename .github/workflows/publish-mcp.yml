name: Publish MCP server (npm)

# Publishes mcp/ as `certmate-mcp-server` on npm (#1017), so an MCP client can
# run it with `npx -y certmate-mcp-server` instead of cloning this repository.
#
# npm Trusted Publishing (OIDC): no npm token is stored anywhere. npm checks
# that the run comes from this repository, this workflow file and the `npm`
# environment, as configured in the package's settings on npmjs.com, and
# attaches a provenance attestation automatically. Requires npm >= 11.5.1 and
# Node >= 22.14, which is why both are set up explicitly below.
#
# Fires on an `mcp-v*` tag, a version stream of its own like the clients'
# `clients-v*`, so it never collides with the server's `v*` releases. Manual
# runs default to a dry run: pack, test and `npm publish --dry-run`.
on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: test and publish
    runs-on: ubuntu-latest
    environment: npm
    # Job-level permissions replace the workflow's, so contents: read is
    # restated. id-token: write is the only credential trusted publishing needs.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm new enough for trusted publishing
        # Trusted publishing needs npm 11.5.1 or later, and the Node this job
        # runs ships an older one. This job holds id-token: write, so the npm it
        # installs runs with the right to publish: it is installed from a tarball
        # whose SHA-512 is written here, not from whatever `npm@11` resolves to
        # on the day of the release. To move it: pick the version, run
        # `npm view npm@X dist.integrity`, and change both values together.
        env:
          NPM_VERSION: '11.21.1'
          NPM_INTEGRITY: 'sha512-YTzL6QBEJXyHcTu0JiUc7RKMp+mzlJtl7rGLmERaXUQeFHIMc9atdr6G9M9C8vDWbv40epoTQAzNL2/PtZVDhQ=='
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm pack "npm@${NPM_VERSION}" --silent
          got="sha512-$(openssl dgst -sha512 -binary "npm-${NPM_VERSION}.tgz" | openssl base64 -A)"
          if [ "$got" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm ${NPM_VERSION} does not match the SHA-512 pinned in this workflow"
            exit 1
          fi
          npm install -g "./npm-${NPM_VERSION}.tgz"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Fail unless the tag matches package.json
        # npm versions are write-once: a tag that disagrees with package.json
        # would publish the wrong number, permanently.
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$REF" in
            refs/tags/mcp-v*)
              tag="${REF#refs/tags/mcp-v}"
              if [ "$tag" != "$version" ]; then
                echo "::error::tag says $tag, mcp/package.json says $version" >&2
                exit 1
              fi
              ;;
          esac
          echo "certmate-mcp-server $version (ref: $REF)"

      - run: npm ci
      - run: npm test

      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi
