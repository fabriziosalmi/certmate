# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The ACME stack moves as one set and by hand (#103): certbot, acme, josepy
      # and the official DNS plugins each declare `certbot>=` / `acme>=` their own
      # version, so one of them bumped alone either fails to install or drags the
      # others. Dependabot must not keep reopening bumps for it. Core packages:
      # ignore ALL updates.
      - dependency-name: "certbot"
      - dependency-name: "josepy"
      - dependency-name: "acme"
      # DNS plugins used to be blocked at MAJOR only, on the reasoning that
      # minor and patch fixes are compatible. They are not, and the exception
      # cost a release: every plugin from certbot's own release train carries
      # `certbot>=` its own version, so a MINOR bump drags certbot off the pin
      # just as surely as a major one.
      #
      #   certbot-dns-route53 5.8.0 -> 5.9.0  requires certbot>=5.9.0
      #
      # Measured while the stack was on 2.10.0: layering such a plugin moved
      # certbot 2.10.0 -> 3.3.0 in a build that reported success (fixed in #533).
      - dependency-name: "certbot-dns-*"
      - dependency-name: "certbot-plugin-*"
      # The pins that hold the rest of the stack together. Each is documented in
      # requirements.txt at the line it appears on;
      # tests/test_dependabot_holds_the_stack.py fails if one is
      # pinned-and-documented but missing here.
      #
      #   dns-lexicon  the resolver set is balanced around 3.25.1; moving it
      #                breaks the lexicon-based plugins against each other.
      #
      # `cryptography` and `pyopenssl` were held here until certbot 5.8.0 (#103):
      # on the old stack a newer cryptography installed cleanly and then killed
      # `certbot --version`. Now certbot/acme 5.8.0 require cryptography>=47 and
      # pyopenssl 26.4.0 requires >=49,<51, so pip refuses what does not fit,
      # and the image build runs `certbot --version`. A bump is tested instead of
      # held; it still needs the lock regenerated, like every exact pin.
      - dependency-name: "dns-lexicon"
      # python-cloudflare changes its shape between majors. certbot-dns-cloudflare
      # declares only a lower bound on it (5.8.0: `cloudflare>=4.0`), so pip
      # resolves any newer bump happily and certbot can die at import —
      # tests/test_requirements_sets.py caught that on #568. It moves with the
      # plugin, by hand. Ignored entirely, like the rest of the held set.
      - dependency-name: "cloudflare"
      # infisical-python 2.3.6 ships no manylinux x86_64 wheel and no sdist,
      # so the amd64 image cannot install it while the arm64 image can. The
      # requirements files have said so next to the pin since it was set, and
      # dependabot proposed 2.3.6 anyway (#795), leaving the explanation of
      # why not to in place above the version it had just changed. A bump
      # that can only install on one of the two published architectures is
      # not a bump this project can take.
      - dependency-name: "infisical-python"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # New python interpreter lines are blocked by the held ACME stack
      # (python 3.14 breaks via josepy — issue #103). The base tag is
      # `python:3.12-slim-trixie`, so dependabot classifies 3.12 -> 3.14 as
      # semver-MINOR (major stays 3); CPython's breaking boundary is its
      # minor number, so both major and minor are ignored here. Patch and
      # digest updates within 3.12 still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
