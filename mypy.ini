# mypy, in its default mode, as a RATCHET: scripts/check_mypy_budget.py counts errors per file and
# lets the counts only go down (#1094). `strict = true` everywhere was measured at 3,242 errors, 82%
# of them annotations that do not exist yet, with 6 of 103 files clean: a gate that starts red is not
# a gate. The default mode's 123 are what mypy finds WITHOUT asking for annotations, and some of them
# are values that can be None being used.
#
# What mypy reports depends on the versions of the packages it reads, which is why CI runs it in its
# own job on the LOCKED set (requirements.lock) and not on the test job's unpinned transitive ones.

[mypy]
python_version = 3.12
files = modules, app.py
warn_unused_configs = True

# Third-party packages with no type information and no stubs we install. Their names are Any here;
# the cost is that a call into them is not checked, which is what it was before mypy.
[mypy-flask_restx.*]
ignore_missing_imports = True
[mypy-boto3.*]
ignore_missing_imports = True
[mypy-botocore.*]
ignore_missing_imports = True
[mypy-azure.*]
ignore_missing_imports = True
[mypy-apscheduler.*]
ignore_missing_imports = True
[mypy-infisical_client.*]
ignore_missing_imports = True
[mypy-hvac.*]
ignore_missing_imports = True
[mypy-authlib.*]
ignore_missing_imports = True
[mypy-akamai.*]
ignore_missing_imports = True

# Modules that are already clean under `--strict` stay so: the flags `strict` stands for, written out
# (mypy cannot set `strict` per module). Add a module here when it is annotated, never to quieten one.
[mypy-modules,modules.api,modules.core,modules.web,modules.api.path_validation,modules.core.audit_context]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True
