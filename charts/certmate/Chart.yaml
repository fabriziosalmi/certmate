apiVersion: v2
name: certmate
description: Self-hosted SSL/TLS certificate lifecycle management — issuance, renewal, discovery, inventory and deployment
type: application
# The chart versions WITH the application, deliberately.
#
# A separate chart version is a second number to bump, and every independent
# copy of a version in this repository has drifted at least once — the docs
# landing pages twice, package-lock.json two releases behind. The chart lives
# in the application's repository and only ever ships that application, so it
# tracks it: one number, bumped by scripts/release.sh, pinned by
# tests/test_helm_chart.py. A chart-only fix rides the next release.
version: 2.44.0
appVersion: "2.44.0"
home: https://www.certmate.org
icon: https://raw.githubusercontent.com/fabriziosalmi/certmate/main/static/img/certmate_logo_256.png
sources:
  - https://github.com/fabriziosalmi/certmate
keywords:
  - certificates
  - tls
  - ssl
  - acme
  - lets-encrypt
  - certificate-lifecycle-management
  - private-ca
maintainers:
  - name: fabriziosalmi
    url: https://github.com/fabriziosalmi
# Read by Artifact Hub (#1018). The image line carries the release number and
# is moved by scripts/release.sh with version/appVersion above; listing the
# image is what makes Artifact Hub run its security scan against it.
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/fabriziosalmi/certmate/blob/main/docs/kubernetes.md
    - name: Chart values
      url: https://github.com/fabriziosalmi/certmate/blob/main/charts/certmate/README.md
    - name: support
      url: https://github.com/fabriziosalmi/certmate/issues
  artifacthub.io/images: |
    - name: certmate
      image: docker.io/fabriziosalmi/certmate:2.44.0
      platforms:
        - linux/amd64
        - linux/arm64
